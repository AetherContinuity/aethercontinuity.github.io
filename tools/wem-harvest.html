<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEM — historiadatan haku (pysyvä, yksi periodi kerrallaan)</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 1rem auto; padding: 0 1rem; background: #faf8f3; color: #2a2a2a; }
  h1 { font-size: 1.1rem; }
  button { font-size: 1rem; padding: .7rem 1.2rem; margin: .3rem 0; cursor: pointer; width: 100%; }
  button:disabled { opacity: .5; }
  .period-row { display: flex; align-items: center; justify-content: space-between; padding: .6rem; margin: .3rem 0; border-radius: 4px; border: 1px solid #ddd; }
  .period-row.done { background: #e8f5e9; border-color: #2d6b3a; }
  .period-row.pending { background: #fff; }
  .period-id { font-weight: bold; }
  .period-status { font-size: .8rem; color: #666; }
  #log { font-family: monospace; font-size: .75rem; white-space: pre-wrap; background: #1a1a1a; color: #d0d0d0; padding: .8rem; border-radius: 4px; max-height: 250px; overflow-y: auto; margin-top: 1rem; }
  .err { color: #ff8080; }
  .ok { color: #80ff80; }
  #exportBox { display: none; margin-top: 1rem; }
  textarea { width: 100%; height: 150px; font-family: monospace; font-size: .65rem; }
  .warn-box { background: #fff3cd; border: 1px solid #d4a017; padding: .6rem; border-radius: 4px; font-size: .85rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>WEM — historiadatan haku</h1>
<div class="warn-box">
  Jokainen periodi tallentuu <strong>pysyvästi tähän selaimeen</strong> (localStorage) välittömästi kun se onnistuu.
  Voit sulkea sivun ja palata myöhemmin — edistys ei katoa. Hae periodit <strong>yksi kerrallaan</strong>,
  odottaen kunkin valmistumista (~1 min/periodi).
</div>

<div id="periodList"></div>

<div id="exportBox">
  <h2>✓ Kaikki periodit valmiit</h2>
  <button onclick="downloadResult()">⬇ Lataa täysi JSON-tiedosto</button>
  <textarea id="resultText" readonly></textarea>
</div>

<div id="log"></div>

<script>
const PROXY = 'https://aci-fingrid-proxy.ruotsalainen-marko.workers.dev/api';
const DS = { consumption:124, production:192, nuclear:188, hydro:191, wind:181, chpDH:201, chpInd:202 };
const PERIODS = [
  { id:'2022-01', label:'Talvibaseline — ennen energiakriisiä',  start:'2022-01-10T00:00:00Z' },
  { id:'2022-08', label:'Energiakriisi käynnistyy',               start:'2022-08-05T00:00:00Z' },
  { id:'2022-11', label:'Kriisikärki — hintahuippu',               start:'2022-11-10T00:00:00Z' },
  { id:'2023-01', label:'Jälkikriisi — hinnat laskevat hitaasti',  start:'2023-01-10T00:00:00Z' },
  { id:'2023-07', label:'Kesäbaseline — matala kulutus',           start:'2023-07-05T00:00:00Z' },
  { id:'2024-01', label:'OL3 kaupallisessa käytössä',              start:'2024-01-10T00:00:00Z' },
  { id:'2024-12', label:'Ensimmäinen täysi OL3-talvi',             start:'2024-12-05T00:00:00Z' },
];
const HOURS = 168;
const STORAGE_PREFIX = 'wem_harvest_';

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// --- Tallennus / lataus localStorageen ---
function getSaved(periodId) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + periodId);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function savePeriod(periodId, data) {
  localStorage.setItem(STORAGE_PREFIX + periodId, JSON.stringify(data));
}

// --- Fetch-logiikka (sama, todistetusti toimiva paloittelu) ---
async function fetchRange(dsId, rFrom, rTo, label, maxRetries=3) {
  const url = `${PROXY}?ds=${dsId}&start=${encodeURIComponent(rFrom.toISOString())}&end=${encodeURIComponent(rTo.toISOString())}&size=300`;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const r = await fetch(url);
      if (r.status === 429) {
        const wait = 3000 * Math.pow(2, attempt);
        log(`  DS ${dsId} ${label}: HTTP 429, odotetaan ${wait/1000}s`, 'err');
        await new Promise(res => setTimeout(res, wait));
        continue;
      }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      return (j.data || j).filter(d => d.value != null);
    } catch(e) {
      if (attempt < maxRetries) {
        await new Promise(res => setTimeout(res, 2000 * (attempt+1)));
      } else {
        log(`  DS ${dsId} ${label}: EPÄONNISTUI — ${e.message}`, 'err');
        return null;
      }
    }
  }
  return null;
}

async function fetchOneDataset(dsId, startISO, hours) {
  const from = new Date(startISO);
  const to = new Date(from.getTime() + hours * 3.6e6);
  if (dsId === DS.consumption) {
    return await fetchRange(dsId, from, to, 'koko 168h');
  }
  const chunkHours = 12;
  const numChunks = Math.ceil(hours / chunkHours);
  let allRows = [];
  for (let c = 0; c < numChunks; c++) {
    const cFrom = new Date(from.getTime() + c*chunkHours*3.6e6);
    const cTo = new Date(Math.min(cFrom.getTime()+chunkHours*3.6e6, to.getTime()));
    if (cFrom >= to) break;
    const rows = await fetchRange(dsId, cFrom, cTo, `lohko ${c+1}/${numChunks}`);
    if (rows) allRows = allRows.concat(rows);
    if (c < numChunks-1) await new Promise(res => setTimeout(res, 250));
  }
  const seen = new Set(); const dedup = [];
  for (const row of allRows) { if (!seen.has(row.startTime)) { seen.add(row.startTime); dedup.push(row); } }
  return dedup.length ? dedup : null;
}

function mergeByHour(datasetRows, periodStartISO, hours) {
  const valueByHour = {};
  for (const [name, rows] of Object.entries(datasetRows)) {
    if (!rows) continue;
    for (const r of rows) {
      const dt = new Date(r.startTime);
      const hourKey = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), dt.getHours()).toISOString();
      // Käytetään UTC-tunnin avainta suoraan aikaleimasta merkkijonona (valtetaan aikavyohyke-ongelmat)
      const utcHourKey = r.startTime.slice(0,13); // "YYYY-MM-DDTHH"
      (valueByHour[utcHourKey] ??= {})[name] ??= [];
      valueByHour[utcHourKey][name].push(r.value);
    }
  }
  const merged = [];
  const start = new Date(periodStartISO);
  for (let h = 0; h < hours; h++) {
    const hourDt = new Date(start.getTime() + h*3.6e6);
    const key = hourDt.toISOString().slice(0,13);
    const vals = valueByHour[key] || {};
    const row = { timestamp: hourDt.toISOString().slice(0,19)+'.000Z' };
    for (const name of Object.keys(DS)) {
      const v = vals[name];
      row[name] = v && v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
    }
    merged.push(row);
  }
  return merged;
}

async function fetchPeriod(period) {
  log(`\n=== ${period.id} (${period.label}) ===`);
  const datasetRows = {};
  const coverage = {};
  for (const [name, dsId] of Object.entries(DS)) {
    log(`  ${name} (DS ${dsId})...`);
    const rows = await fetchOneDataset(dsId, period.start, HOURS);
    datasetRows[name] = rows;
    if (rows) {
      const hourSet = new Set(rows.map(r => r.startTime.slice(0,13)));
      coverage[name] = `${hourSet.size}/${HOURS}`;
      log(`  ✓ ${name}: ${hourSet.size}/${HOURS} tuntia`, 'ok');
    } else {
      coverage[name] = `0/${HOURS}`;
    }
    await new Promise(res => setTimeout(res, 500));
  }
  const merged = mergeByHour(datasetRows, period.start, HOURS);
  const result = {
    id: period.id, label: period.label, start: period.start,
    fetched_at: new Date().toISOString(),
    coverage, data: merged,
  };
  savePeriod(period.id, result);
  log(`  TALLENNETTU pysyvästi (localStorage).`, 'ok');
  return result;
}

function renderPeriodList() {
  const el = document.getElementById('periodList');
  el.innerHTML = '';
  let allDone = true;
  for (const period of PERIODS) {
    const saved = getSaved(period.id);
    const row = document.createElement('div');
    row.className = 'period-row ' + (saved ? 'done' : 'pending');
    const info = document.createElement('div');
    info.innerHTML = `<div class="period-id">${period.id}</div><div class="period-status">${saved ? '✓ Valmis (' + new Date(saved.fetched_at).toLocaleString('fi-FI') + ')' : period.label}</div>`;
    row.appendChild(info);
    if (!saved) {
      allDone = false;
      const btn = document.createElement('button');
      btn.style.width = 'auto';
      btn.textContent = '▶ Hae';
      btn.onclick = () => runOne(period);
      row.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.style.width = 'auto';
      btn.textContent = '↻ Hae uudelleen';
      btn.style.fontSize = '.7rem';
      btn.onclick = () => runOne(period);
      row.appendChild(btn);
    }
    el.appendChild(row);
  }
  document.getElementById('exportBox').style.display = allDone ? 'block' : 'none';
  if (allDone) buildExport();
}

let running = false;
async function runOne(period) {
  if (running) { log('Odota edellisen haun valmistumista.', 'err'); return; }
  running = true;
  try {
    await fetchPeriod(period);
  } catch(e) {
    log('VIRHE: ' + e.message, 'err');
  }
  running = false;
  renderPeriodList();
}

function buildExport() {
  const result = { fetched_at: new Date().toISOString(), source: PROXY, periods: {} };
  for (const period of PERIODS) {
    const saved = getSaved(period.id);
    if (saved) result.periods[period.id] = saved;
  }
  document.getElementById('resultText').value = JSON.stringify(result);
}

function downloadResult() {
  const text = document.getElementById('resultText').value;
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'wem_backtest_historical_final.json';
  a.click();
}

renderPeriodList();
</script>
</body>
</html>
